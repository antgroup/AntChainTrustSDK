name: Feature request
description: Propose an SDK capability for a concrete use case.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: >-
        Describe the problem, target platform, and any current workaround.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: >-
        Describe the desired behavior and how it would help your application.
    validations:
      required: true
